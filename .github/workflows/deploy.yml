name: Deploy

# Only push-to-master and manual dispatch. Deliberately NOT pull_request:
# this repo is public, and DEPLOY_SSH_KEY grants shell on the production host,
# so it must never be exposed to a workflow a fork can trigger.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
  workflow_dispatch:

# One deploy at a time; a queued run supersedes an older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to netcup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ~/.ssh/deploy_key
          BRANCH: master
          DOMAIN: mcp.profullstack.com
          RUNTIME: bun
        run: |
          chmod +x bin/deploy.sh bin/provision.sh
          ./bin/deploy.sh

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
